<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="880" height="470"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box   { fill:#ffffff; stroke:#4a5568; stroke-width:1.4; rx:6; }
    .stage { fill:#eef4fb; stroke:#2b6cb0; stroke-width:1.4; }
    .out   { fill:#f0f7ee; stroke:#38773a; stroke-width:1.4; }
    .ttl   { font-size:13px; font-weight:600; fill:#1a202c; }
    .sub   { font-size:11px; fill:#4a5568; }
    .tool  { font-size:10.5px; fill:#718096; font-style:italic; }
    .lane  { font-size:11px; font-weight:600; fill:#718096; letter-spacing:0.06em; }
    .arrow { stroke:#4a5568; stroke-width:1.4; fill:none; marker-end:url(#a); }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <text class="lane" x="14" y="30">INPUTS</text>
  <rect class="box" x="14" y="42" width="150" height="66" rx="6"/>
  <text class="ttl" x="26" y="64">FASTQ reads</text>
  <text class="sub" x="26" y="82">one folder per sample,</text>
  <text class="sub" x="26" y="97">paired or single end</text>

  <rect class="box" x="14" y="120" width="150" height="66" rx="6"/>
  <text class="ttl" x="26" y="142">Reference genome</text>
  <text class="sub" x="26" y="160">genome.fasta plus</text>
  <text class="sub" x="26" y="175">genome.gff annotations</text>

  <rect class="box" x="14" y="198" width="150" height="52" rx="6"/>
  <text class="ttl" x="26" y="220">Sample sheet</text>
  <text class="sub" x="26" y="238">groups and outgroups</text>

  <text class="lane" x="200" y="30">1-MAPPING</text>
  <rect class="stage" x="200" y="42" width="180" height="86" rx="6"/>
  <text class="ttl" x="212" y="64">Trim and align</text>
  <text class="sub" x="212" y="82">per sample, against the</text>
  <text class="sub" x="212" y="97">reference for its group</text>
  <text class="tool" x="212" y="116">cutadapt · sickle · bwa · samtools</text>

  <rect class="stage" x="200" y="146" width="180" height="86" rx="6"/>
  <text class="ttl" x="212" y="168">Pile up and call</text>
  <text class="sub" x="212" y="186">read counts, call quality</text>
  <text class="sub" x="212" y="201">and candidate positions</text>
  <text class="tool" x="212" y="220">samtools · bcftools</text>

  <text class="lane" x="416" y="30">2-SNV-FILTERING</text>
  <rect class="stage" x="416" y="42" width="196" height="86" rx="6"/>
  <text class="ttl" x="428" y="64">Candidate table</text>
  <text class="sub" x="428" y="82">every sample genotyped at</text>
  <text class="sub" x="428" y="97">every candidate position,</text>
  <text class="sub" x="428" y="112">one table per group</text>

  <rect class="stage" x="416" y="146" width="196" height="102" rx="6"/>
  <text class="ttl" x="428" y="168">Neural network</text>
  <text class="ttl" x="428" y="186">and quality checks</text>
  <text class="sub" x="428" y="204">each position scored by the</text>
  <text class="sub" x="428" y="219">CNN and by nine rule-based</text>
  <text class="sub" x="428" y="234">checks, then labelled</text>

  <rect class="stage" x="416" y="266" width="196" height="66" rx="6"/>
  <text class="ttl" x="428" y="288">Annotate</text>
  <text class="sub" x="428" y="306">gene, codon, amino acid</text>
  <text class="sub" x="428" y="321">change for each SNV</text>

  <text class="lane" x="648" y="30">3-ANALYSIS</text>
  <rect class="out" x="648" y="42" width="218" height="58" rx="6"/>
  <text class="ttl" x="660" y="64">SNV tables</text>
  <text class="sub" x="660" y="83">snv_table_final.tsv and the</text>
  <text class="sub" x="660" y="96">unfiltered candidate list</text>

  <rect class="out" x="648" y="116" width="218" height="52" rx="6"/>
  <text class="ttl" x="660" y="138">Interactive report</text>
  <text class="sub" x="660" y="156">snv_dashboard.html</text>

  <rect class="out" x="648" y="184" width="218" height="52" rx="6"/>
  <text class="ttl" x="660" y="206">Phylogeny and dMRCA</text>
  <text class="sub" x="660" y="224">parsimony tree, distances</text>

  <rect class="out" x="648" y="252" width="218" height="52" rx="6"/>
  <text class="ttl" x="660" y="274">dN/dS</text>
  <text class="sub" x="660" y="292">genome-wide and per gene</text>

  <rect class="out" x="648" y="320" width="218" height="52" rx="6"/>
  <text class="ttl" x="660" y="342">QC figures</text>
  <text class="sub" x="660" y="360">per-SNV read counts, heatmaps</text>

  <path class="arrow" d="M164,75 L196,84"/>
  <path class="arrow" d="M164,153 L196,160"/>
  <path class="arrow" d="M164,222 L196,188"/>
  <path class="arrow" d="M290,128 L290,142"/>
  <path class="arrow" d="M380,110 L412,95"/>
  <path class="arrow" d="M380,190 L412,110"/>
  <path class="arrow" d="M514,128 L514,142"/>
  <path class="arrow" d="M514,248 L514,262"/>
  <path class="arrow" d="M612,290 L644,80"/>
  <path class="arrow" d="M612,296 L644,150"/>
  <path class="arrow" d="M612,300 L644,215"/>
  <path class="arrow" d="M612,302 L644,282"/>
  <path class="arrow" d="M612,306 L644,348"/>

  <text class="sub" x="14" y="430">Every group in the sample sheet is analysed on its own, from the candidate table onwards.</text>
  <text class="sub" x="14" y="450">Samples marked as outgroup are mapped and genotyped, but only used to infer the ancestral allele.</text>
</svg>
