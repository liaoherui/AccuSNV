<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box  { fill:#ffffff; stroke:#4a5568; stroke-width:1.4; rx:6; }
    .obs  { fill:#eef4fb; stroke:#2b6cb0; stroke-width:1.5; }
    .exp  { fill:#fffaf0; stroke:#b7791f; stroke-width:1.5; }
    .fin  { fill:#f0f7ee; stroke:#38773a; stroke-width:1.7; }
    .ttl  { font-size:13px; font-weight:600; fill:#1a202c; }
    .sub  { font-size:11px; fill:#4a5568; }
    .mono { font-size:12px; font-family:ui-monospace, SFMono-Regular, Menlo, monospace; fill:#1a202c; }
    .arrow{ stroke:#4a5568; stroke-width:1.4; fill:none; marker-end:url(#c); }
  </style>
  <defs>
    <marker id="c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect class="obs" x="14" y="20" width="250" height="108" rx="6"/>
  <text class="ttl" x="28" y="44">What you observed</text>
  <text class="sub" x="28" y="65">Count nonsynonymous and synonymous</text>
  <text class="sub" x="28" y="80">SNVs in the final table</text>
  <text class="mono" x="28" y="104">p_nonsyn = N / (N + S)</text>
  <text class="sub" x="28" y="120">6 / (6 + 2) = 0.750</text>

  <rect class="exp" x="14" y="152" width="250" height="122" rx="6"/>
  <text class="ttl" x="28" y="176">What neutral evolution predicts</text>
  <text class="sub" x="28" y="197">Every codon in every annotated gene,</text>
  <text class="sub" x="28" y="212">weighted by how often each of the six</text>
  <text class="sub" x="28" y="227">mutation classes actually occurred</text>
  <text class="mono" x="28" y="251">probnonsyn_expected</text>
  <text class="sub" x="28" y="267">0.757 for this reference genome</text>

  <rect class="box" x="320" y="20" width="200" height="108" rx="6"/>
  <text class="ttl" x="334" y="44">Observed odds</text>
  <text class="mono" x="334" y="72">p / (1 - p)</text>
  <text class="sub" x="334" y="94">0.750 / 0.250 = 3.000</text>

  <rect class="box" x="320" y="152" width="200" height="122" rx="6"/>
  <text class="ttl" x="334" y="176">Expected odds</text>
  <text class="mono" x="334" y="204">p / (1 - p)</text>
  <text class="sub" x="334" y="226">0.757 / 0.243 = 3.117</text>

  <rect class="fin" x="576" y="76" width="228" height="140" rx="6"/>
  <text class="ttl" x="592" y="102">dN/dS</text>
  <text class="mono" x="592" y="130">observed / expected</text>
  <text class="mono" x="592" y="154">3.000 / 3.117 = 0.962</text>
  <text class="sub" x="592" y="178">below 1: purifying selection</text>
  <text class="sub" x="592" y="194">near 1: neutral</text>
  <text class="sub" x="592" y="210">above 1: adaptive selection</text>

  <path class="arrow" d="M264,74 L316,74"/>
  <path class="arrow" d="M264,213 L316,213"/>
  <path class="arrow" d="M520,74 L548,74 L548,140 L572,140"/>
  <path class="arrow" d="M520,213 L548,213 L548,150 L572,150"/>
</svg>
