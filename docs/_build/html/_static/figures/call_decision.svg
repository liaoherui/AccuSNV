<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 448" width="800" height="448"
     font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .q     { fill:#fffaf0; stroke:#b7791f; stroke-width:1.4; }
    .keep  { fill:#f0f7ee; stroke:#38773a; stroke-width:1.6; }
    .drop  { fill:#fdf0f0; stroke:#9b2c2c; stroke-width:1.6; }
    .ttl   { font-size:12.5px; fill:#1a202c; }
    .lbl   { font-size:11px; fill:#4a5568; font-weight:600; }
    .res   { font-size:12.5px; font-weight:700; }
    .sub   { font-size:10.5px; fill:#4a5568; }
    .arrow { stroke:#4a5568; stroke-width:1.3; fill:none; marker-end:url(#b); }
  </style>
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>

  <rect class="q" x="14" y="16" width="250" height="46" rx="6"/>
  <text class="ttl" x="26" y="36">Did the variant-quality check</text>
  <text class="ttl" x="26" y="53">remove this position?</text>

  <rect class="drop" x="330" y="16" width="180" height="46" rx="6"/>
  <text class="res" x="342" y="36" fill="#9b2c2c">Not a SNV</text>
  <text class="sub" x="342" y="53">dropped from every table</text>

  <rect class="q" x="14" y="98" width="250" height="46" rx="6"/>
  <text class="ttl" x="26" y="118">Did the CNN call a variant?</text>
  <text class="sub" x="26" y="135">CNN probability above 0.5</text>

  <rect class="keep" x="330" y="98" width="220" height="46" rx="6"/>
  <text class="res" x="342" y="118" fill="#38773a">Kept</text>
  <text class="sub" x="342" y="135">Pred_label = 1, in snv_table_final.tsv</text>

  <rect class="q" x="14" y="180" width="250" height="46" rx="6"/>
  <text class="ttl" x="26" y="200">Did all nine rule-based</text>
  <text class="ttl" x="26" y="217">checks pass?</text>

  <rect class="drop" x="330" y="180" width="220" height="46" rx="6"/>
  <text class="res" x="342" y="200" fill="#9b2c2c">Not a SNV</text>
  <text class="sub" x="342" y="217">neither method called a variant</text>

  <rect class="q" x="14" y="262" width="250" height="80" rx="6"/>
  <text class="ttl" x="26" y="282">Only the rule-based checks</text>
  <text class="ttl" x="26" y="299">called it. Is the read evidence</text>
  <text class="ttl" x="26" y="316">clean enough to override</text>
  <text class="ttl" x="26" y="333">the CNN?</text>

  <rect class="drop" x="330" y="258" width="220" height="100" rx="6"/>
  <text class="res" x="342" y="281" fill="#9b2c2c">Not a SNV</text>
  <text class="sub" x="342" y="301">the alignment has a gap here, or</text>
  <text class="sub" x="342" y="317">too many samples have mixed</text>
  <text class="sub" x="342" y="333">reads, or the variant reads are</text>
  <text class="sub" x="342" y="349">weaker than the background</text>

  <rect class="keep" x="330" y="382" width="220" height="46" rx="6"/>
  <text class="res" x="342" y="402" fill="#38773a">Kept (rescued)</text>
  <text class="sub" x="342" y="419">CNN_pred is rewritten to 1</text>

  <path class="arrow" d="M264,39 L326,39"/>
  <text class="lbl" x="278" y="32">yes</text>
  <path class="arrow" d="M139,62 L139,94"/>
  <text class="lbl" x="146" y="82">no</text>

  <path class="arrow" d="M264,121 L326,121"/>
  <text class="lbl" x="278" y="114">yes</text>
  <path class="arrow" d="M139,144 L139,176"/>
  <text class="lbl" x="146" y="164">no</text>

  <path class="arrow" d="M264,203 L326,203"/>
  <text class="lbl" x="278" y="196">no</text>
  <path class="arrow" d="M139,226 L139,258"/>
  <text class="lbl" x="146" y="246">yes</text>

  <path class="arrow" d="M264,290 L326,290"/>
  <text class="lbl" x="278" y="283">no</text>
  <path class="arrow" d="M139,342 L139,405 L326,405"/>
  <text class="lbl" x="146" y="372">yes</text>
</svg>
